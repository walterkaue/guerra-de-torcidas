<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelos de câmera dos Lances</title>
    <style>
      body { margin: 0; overflow: hidden; background: #0b3d1f; font-family: system-ui, sans-serif; color: #f5f5f0; }
      .topo { position: fixed; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: baseline;
        padding: 6px 12px; border-radius: 6px; background: #0a0a0a; box-shadow: inset 6px 0 0 #c8102e; font-weight: 800; letter-spacing: .05em; }
      .topo strong { color: #e9c75a; font-size: 22px; }
      .situacao { position: fixed; top: 54px; left: 16px; right: 16px; margin: 0 auto; width: fit-content; padding: 6px 12px; border-radius: 10px;
        background: rgba(0,0,0,.72); font-weight: 600; font-size: 15px; text-align: center; }
      .chegada { position: fixed; left: 16px; right: 16px; top: 104px; padding: 10px 12px; border: 3px solid #fff; border-radius: 6px;
        background: #c8102e; font-weight: 800; line-height: 1.25; transform: rotate(-1.5deg); box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 4px 0 2px rgba(0,0,0,.4); }
      .chegada b { display: block; font-size: 12px; letter-spacing: .08em; color: #ffd23f; }
      .rotulo-modelo { position: fixed; bottom: 10px; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; opacity: .7; }
    </style>
  </head>
